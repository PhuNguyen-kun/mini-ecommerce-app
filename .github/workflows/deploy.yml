name: Deploy to AWS EC2

on:
  push:
    branches:
      - staging

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ec2-user
  EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
  EC2_DOMAIN: ${{ secrets.EC2_DOMAIN }}

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: ./frontend
        run: |
          if [ -z "${{ secrets.EC2_DOMAIN }}" ]; then
            echo "❌ Error: EC2_DOMAIN secret is not set!"
            exit 1
          fi
          echo "VITE_API_URL=http://${{ secrets.EC2_DOMAIN }}/api" > .env.production
          npm ci
          npm run build

      - name: Upload frontend build
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "frontend/dist"
          target: "/home/ec2-user/mini-ecommerce-app/frontend"
          strip_components: 1
          rm: true

      - name: Verify upload
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            if [ ! -d "/home/ec2-user/mini-ecommerce-app/frontend/dist" ]; then
              echo "❌ Error: dist/ folder not found after upload!"
              exit 1
            fi
            if [ -z "$(ls -A /home/ec2-user/mini-ecommerce-app/frontend/dist)" ]; then
              echo "❌ Error: dist/ folder is empty!"
              exit 1
            fi
            echo "✅ dist/ folder uploaded successfully"
            echo "📁 Checking dist/ structure:"
            ls -la /home/ec2-user/mini-ecommerce-app/frontend/dist | head -10
            echo "📄 Checking for index.html:"
            ls -la /home/ec2-user/mini-ecommerce-app/frontend/dist/*.html 2>/dev/null || echo "⚠️ No HTML files found in root"
            echo "📦 Checking for assets folder:"
            ls -la /home/ec2-user/mini-ecommerce-app/frontend/dist/assets 2>/dev/null | head -5 || echo "⚠️ No assets folder found"

  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd ~/mini-ecommerce-app/backend
            git fetch origin
            git checkout staging
            git pull origin staging
            docker compose down
            docker compose up -d --build

  deploy-frontend:
    needs: [build-frontend, deploy-backend]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd ~/mini-ecommerce-app/frontend

            # Backup dist/ trước khi git pull (nếu có)
            if [ -d "dist" ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
              echo "📦 Backing up dist/ folder..."
              cp -r dist dist.backup
            fi

            # Git operations
            git fetch origin
            git reset --hard origin/staging

            # Restore dist/ nếu bị mất
            if [ ! -d "dist" ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
              if [ -d "dist.backup" ]; then
                echo "🔄 Restoring dist/ from backup..."
                rm -rf dist
                mv dist.backup dist
              else
                echo "❌ Error: dist/ folder not found and no backup available!"
                echo "Please ensure build-frontend job completed successfully"
                exit 1
              fi
            fi

            # Kiểm tra dist/ có files không
            if [ -z "$(ls -A dist)" ]; then
              echo "❌ Error: dist/ folder is empty!"
              exit 1
            fi

            # Kiểm tra docker-compose.yml có tồn tại không
            if [ ! -f "docker-compose.yml" ]; then
              echo "❌ Error: docker-compose.yml not found!"
              exit 1
            fi

            echo "✅ dist/ folder found, deploying..."
            docker compose up -d --build
